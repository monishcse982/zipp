apiVersion: v2
name: zipp-stack
description: Local Kubernetes stack for Zipp
type: application
version: 0.1.0
appVersion: "0.1.0"

dependencies:
  - name: zipp
    version: 0.1.0
    repository: file://../zipp
    condition: zipp.enabled
  - name: postgresql
    version: 18.11.4
    repository: oci://registry-1.docker.io/bitnamicharts
    condition: postgresql.enabled
  - name: valkey
    version: 0.11.0
    repository: https://valkey.io/valkey-helm/
    condition: valkey.enabled
