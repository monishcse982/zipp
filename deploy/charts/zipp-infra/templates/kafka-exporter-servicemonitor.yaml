{{- if and .Values.kafka.enabled .Values.kafka.exporter.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Values.kafka.clusterName }}-kafka-exporter-metrics
  labels:
    app.kubernetes.io/name: zipp-kafka-exporter-metrics
    app.kubernetes.io/instance: {{ .Release.Name }}
spec:
  type: ClusterIP
  selector:
    strimzi.io/cluster: {{ .Values.kafka.clusterName }}
    strimzi.io/name: {{ .Values.kafka.clusterName }}-kafka-exporter
  ports:
    - name: tcp-prometheus
      port: 9404
      targetPort: tcp-prometheus
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: {{ .Values.kafka.clusterName }}-kafka-exporter
  labels:
    app.kubernetes.io/part-of: zipp-infra
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: zipp-kafka-exporter-metrics
      app.kubernetes.io/instance: {{ .Release.Name }}
  namespaceSelector:
    matchNames:
      - {{ .Release.Namespace }}
  endpoints:
    - port: tcp-prometheus
      path: /metrics
      interval: 15s
{{- end }}
