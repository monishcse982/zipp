postgresql:
  enabled: true

  auth:
    existingSecret: zipp-postgresql
    username: zipp_user
    database: zipp

  primary:
    resources:
      requests:
        cpu: 100m
        memory: 128Mi
      limits:
        cpu: 500m
        memory: 256Mi
    persistence:
      enabled: true
      size: 2Gi

valkey:
  enabled: true
  fullnameOverride: valkey

  auth:
    enabled: true
    usersExistingSecret: zipp-valkey
    aclUsers:
      default:
        permissions: "~* &* +@all"
        passwordKey: default

  dataStorage:
    enabled: true
    requestedSize: 1Gi
    keepPvc: true

  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

  metrics:
    enabled: true
    exporter:
      resources:
        requests:
          cpu: 10m
          memory: 32Mi
        limits:
          cpu: 100m
          memory: 64Mi
    serviceMonitor:
      enabled: true
      interval: 15s

kafka:
  enabled: true
  clusterName: zipp
  userName: zipp-user
  storageSize: 2Gi
