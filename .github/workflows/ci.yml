name: Build and safety checks

on:
  pull_request:
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  frontend:
    name: Frontend quality and build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
        working-directory: frontend
      - name: Lint, typecheck, and test
        run: npm run lint && npm run typecheck && npm test
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend

  python:
    name: Python quality and unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          version: "0.12.17"
          enable-cache: true
      - name: Install Python and locked dependencies
        run: |
          uv python install 3.12
          uv sync --locked --group dev --python 3.12
      - name: Lint
        run: uv run --locked --no-sync ruff check .
      - name: Check formatting
        run: uv run --locked --no-sync ruff format --check .
      - name: Run unit tests
        run: uv run --locked --no-sync coverage run -m unittest discover -s tests/unit -v
      - name: Report line and branch coverage
        run: uv run --locked --no-sync coverage report

  helm:
    name: Helm charts
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Register Valkey chart repository
        run: helm repo add valkey https://valkey.io/valkey-helm/
      - name: Build locked dependencies, lint, and render
        run: make chart-validate HELM_CONTEXT=

  workflows:
    name: GitHub Actions workflows
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Validate workflows
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7

  image:
    name: Docker image
    needs: [frontend, python, helm, workflows, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      REGISTRY: ghcr.io
      API_IMAGE: ghcr.io/${{ github.repository_owner }}/zipp-api
      UI_IMAGE: ghcr.io/${{ github.repository_owner }}/zipp-ui
      VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL || 'http://localhost:8080' }}
      VITE_COGNITO_ISSUER: ${{ vars.VITE_COGNITO_ISSUER || 'https://cognito-idp.example.com/example' }}
      VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID || 'ci-public-client' }}
      VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN || 'https://login.example.com' }}
      VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI || 'http://localhost:5173/auth/callback' }}
      VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI || 'http://localhost:5173/' }}
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Validate published UI configuration
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          PUBLISH_VITE_API_BASE_URL: ${{ vars.VITE_API_BASE_URL }}
          PUBLISH_VITE_COGNITO_ISSUER: ${{ vars.VITE_COGNITO_ISSUER }}
          PUBLISH_VITE_COGNITO_CLIENT_ID: ${{ vars.VITE_COGNITO_CLIENT_ID }}
          PUBLISH_VITE_COGNITO_DOMAIN: ${{ vars.VITE_COGNITO_DOMAIN }}
          PUBLISH_VITE_COGNITO_REDIRECT_URI: ${{ vars.VITE_COGNITO_REDIRECT_URI }}
          PUBLISH_VITE_COGNITO_LOGOUT_URI: ${{ vars.VITE_COGNITO_LOGOUT_URI }}
        run: |
          set -euo pipefail

          missing=()
          for name in \
            PUBLISH_VITE_API_BASE_URL \
            PUBLISH_VITE_COGNITO_ISSUER \
            PUBLISH_VITE_COGNITO_CLIENT_ID \
            PUBLISH_VITE_COGNITO_DOMAIN \
            PUBLISH_VITE_COGNITO_REDIRECT_URI \
            PUBLISH_VITE_COGNITO_LOGOUT_URI
          do
            if [[ -z "${!name:-}" ]]; then
              missing+=("${name#PUBLISH_}")
            fi
          done

          if (( ${#missing[@]} > 0 )); then
            printf 'Missing repository variable: %s\n' "${missing[@]}" >&2
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3

      - name: Log in to GitHub Container Registry
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and optionally publish API image
        id: api-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: .
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ env.API_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Zipp API
          cache-from: type=gha,scope=zipp-api
          cache-to: type=gha,mode=max,scope=zipp-api

      - name: Build and optionally publish UI image
        id: ui-image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6
        with:
          context: frontend
          push: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
          tags: ${{ env.UI_IMAGE }}:${{ github.sha }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.revision=${{ github.sha }}
            org.opencontainers.image.title=Zipp UI
          build-args: |
            VITE_API_BASE_URL=${{ env.VITE_API_BASE_URL }}
            VITE_COGNITO_ISSUER=${{ env.VITE_COGNITO_ISSUER }}
            VITE_COGNITO_CLIENT_ID=${{ env.VITE_COGNITO_CLIENT_ID }}
            VITE_COGNITO_DOMAIN=${{ env.VITE_COGNITO_DOMAIN }}
            VITE_COGNITO_REDIRECT_URI=${{ env.VITE_COGNITO_REDIRECT_URI }}
            VITE_COGNITO_LOGOUT_URI=${{ env.VITE_COGNITO_LOGOUT_URI }}
          cache-from: type=gha,scope=zipp-ui
          cache-to: type=gha,mode=max,scope=zipp-ui

      - name: Write published image summary
        if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
        env:
          API_DIGEST: ${{ steps.api-image.outputs.digest }}
          UI_DIGEST: ${{ steps.ui-image.outputs.digest }}
        run: |
          {
            echo "## Published container images"
            echo
            echo "- API: \`$API_IMAGE:$GITHUB_SHA\`"
            echo "- API digest: \`$API_DIGEST\`"
            echo "- UI: \`$UI_IMAGE:$GITHUB_SHA\`"
            echo "- UI digest: \`$UI_DIGEST\`"
          } >> "$GITHUB_STEP_SUMMARY"

  deploy-ec2:
    name: Deploy application to EC2
    needs: image
    if: ${{ github.event_name == 'push' && github.ref == 'refs/heads/master' }}
    runs-on: [self-hosted, linux, x64, zipp-ec2]
    timeout-minutes: 15
    environment: EC2
    concurrency:
      group: zipp-ec2-workload
      cancel-in-progress: false
    permissions:
      contents: read
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Deploy published images
        run: make ec2-deploy-app IMAGE_TAG="$GITHUB_SHA"

      - name: Write deployment summary
        run: |
          {
            echo "## EC2 application deployment"
            echo
            echo "Deployed API and UI images for commit \`$GITHUB_SHA\`."
            echo
            echo "- API: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/zipp-api:$GITHUB_SHA\`"
            echo "- UI: \`ghcr.io/${GITHUB_REPOSITORY_OWNER}/zipp-ui:$GITHUB_SHA\`"
          } >> "$GITHUB_STEP_SUMMARY"

  secrets:
    name: Secret scan
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
      pull-requests: read
    steps:
      - name: Check out full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check committed content and file paths
        run: python3 scripts/check-git-content.py --working-tree
      - name: Scan Git history for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITLEAKS_VERSION: "8.30.1"
          GITLEAKS_ENABLE_COMMENTS: "false"
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: "false"
