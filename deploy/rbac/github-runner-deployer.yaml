apiVersion: v1
kind: ServiceAccount
metadata:
  name: github-runner-deployer
  namespace: zipp
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-runner-deployer
  namespace: zipp
rules:
  - apiGroups: [""]
    resources:
      - secrets
      - services
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: [""]
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["apps"]
    resources:
      - deployments
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["apps"]
    resources:
      - replicasets
    verbs:
      - get
      - list
      - watch
  - apiGroups: ["batch"]
    resources:
      - jobs
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
  - apiGroups: ["monitoring.coreos.com"]
    resources:
      - servicemonitors
    verbs:
      - get
      - list
      - watch
      - create
      - update
      - patch
      - delete
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: github-runner-zipp-namespace-reader
rules:
  - apiGroups: [""]
    resources:
      - namespaces
    resourceNames:
      - zipp
    verbs:
      - get
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-runner-deployer
  namespace: zipp
subjects:
  - kind: ServiceAccount
    name: github-runner-deployer
    namespace: zipp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: github-runner-deployer
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: github-runner-zipp-namespace-reader
subjects:
  - kind: ServiceAccount
    name: github-runner-deployer
    namespace: zipp
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: github-runner-zipp-namespace-reader
