replicaCount: 1

image:
  repository: zipp
  pullPolicy: Never
  tag: local

migrations:
  enabled: true
  envSecretName: zipp-env
  activeDeadlineSeconds: 240
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 256Mi

service:
  type: ClusterIP
  port: 8000

livenessProbe:
  httpGet:
    path: /metrics
    port: http

readinessProbe:
  httpGet:
    path: /metrics
    port: http

resources:
  requests:
    cpu: 200m
    memory: 128Mi
  limits:
    cpu: "1"
    memory: 512Mi

monitoring:
  serviceMonitor:
    enabled: true
    interval: 15s

frontend:
  enabled: true
  image:
    repository: zipp-ui
    tag: local
    pullPolicy: Never
  resources:
    requests:
      cpu: 25m
      memory: 32Mi
    limits:
      cpu: 200m
      memory: 128Mi
